<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
<title>Ugly sweater - Merry &amp; Bright &amp; CRI ≥ 95</title>
<meta name="viewport" content="width=device-width" />
<link rel="icon" />
<link rel="stylesheet" href="game.css" />
</head>
<body>
<div id="field">
<img src="sweater.jpeg" width="796" height="533" />
<svg xmlns="http://www.w3.org/2000/svg" />
<img src="checkmark.jpeg" class="checkmark" width="52" height="44" />
</div>
<div id="toolbar">
<button data-color="1" class="active" />
<button data-color="2" />
<button data-color="3" />
<button data-color="4" />
<button data-color="0" />
<a href="index.xhtml" />
</div>
<script src="game.js" />
<script>
circle(440, 158, { className: "light eye" });
circle(324, 160, { className: "light eye" });
circle(392, 216, { className: "light nose" });
circle(280, 238, { className: "light mouth m1 "});
circle(488, 256, { className: "light mouth m5 "});
circle(322, 294, { className: "light mouth m2 "});
circle(438, 294, { className: "light mouth m4 "});
circle(378, 328, { className: "light mouth m3 "});
circle(434, 400);
circle(432, 472);
edge(0, 1);
edge(0, 2);
edge(0, 4);
edge(1, 2);
edge(1, 3);
edge(2, 3);
edge(2, 4);
edge(2, 5);
edge(2, 6);
edge(2, 7);
edge(3, 5);
edge(4, 6);
edge(5, 7);
edge(6, 7);
edge(6, 8);
edge(7, 8);
edge(8, 9);
</script>
<style><![CDATA[
@keyframes blink {
	50%, 52% { opacity: 1 }
	50.001%, 51.999% { opacity: .5 }
}

.eye {
	animation: blink 14s infinite;
}

@keyframes flicker {
	80%, 82%, 84%, 86% { opacity: 1 }
	81%, 83%, 85% { opacity: .5 }
}

.nose {
	animation: flicker 7s infinite;
}

.mouth {
	animation: blink 20s infinite;

	&.m2 { animation-delay: 0.25s }
	&.m3 { animation-delay: 0.50s }
	&.m4 { animation-delay: 0.75s }
	&.m5 { animation-delay: 1.00s }
}
]]></style>
</body>
</html>
